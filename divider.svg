<svg width="100%" height="24" viewBox="0 0 1200 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Banner neon -->
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"></stop>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"></stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"></stop>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Line -->
  <line x1="100" y1="12" x2="1100" y2="12" stroke="url(#line)" stroke-width="1.2" filter="url(#glow)"></line>
</svg>
